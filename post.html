<script>

marked.setOptions({
  breaks: false,
  gfm: true
});


const params = new URLSearchParams(window.location.search);

const slug = params.get('slug');

const content = document.getElementById('article-content');



/*
 * Convert Markdown image paths into paths
 * that work with the current site structure.
 *
 * Your Markdown can contain:
 *
 * images/cs/AES.png
 *
 * /images/cs/AES.png
 *
 * posts/images/cs/AES.png
 *
 * and they will all resolve correctly.
 */
function fixImagePaths(markdown) {

  return markdown.replace(
    /(!\[[^\]]*\]\()([^)]+)(\))/g,
    function(match, start, imagePath, end) {

      /*
       * Leave external images untouched.
       */
      if (
        imagePath.startsWith('http://') ||
        imagePath.startsWith('https://') ||
        imagePath.startsWith('data:') ||
        imagePath.startsWith('//')
      ) {
        return match;
      }


      /*
       * Remove leading slash.
       *
       * /images/cs/AES.png
       * becomes
       * images/cs/AES.png
       */
      imagePath = imagePath.replace(/^\/+/, '');


      /*
       * If the Markdown already contains posts/,
       * don't add it again.
       */
      if (!imagePath.startsWith('posts/')) {

        imagePath = 'posts/' + imagePath;

      }


      return start + imagePath + end;

    }
  );

}



/*
 * Load the requested writeup.
 */
async function loadPost() {

  /*
   * No slug provided.
   */
  if (!slug) {

    content.innerHTML = `
      <p>
        No post specified.
        <a href="index.html#writeups">
          Back to the case log.
        </a>
      </p>
    `;

    return;
  }


  try {

    /*
     * Load manifest.
     */
    const manRes = await fetch('posts/manifest.json');


    if (!manRes.ok) {

      throw new Error('Could not load manifest.json');

    }


    const posts = await manRes.json();


    /*
     * Find requested post.
     */
    const meta = posts.find(
      p => p.slug === slug
    );


    if (!meta) {

      content.innerHTML = `
        <p>
          No post found for "${slug}".
          <a href="index.html#writeups">
            Back to the case log.
          </a>
        </p>
      `;

      return;
    }


    /*
     * Update browser title.
     */
    document.title =
      `${meta.title} — m7mad.sec`;

    document.getElementById('og-title').content =
      `${meta.title} — m7mad.sec`;

    if (meta.excerpt) {
      document.getElementById('og-description').content = meta.excerpt;
    }


    /*
     * Load Markdown.
     */
const mdRes = await fetch(`/posts/${encodeURIComponent(slug)}.md`);


    if (!mdRes.ok) {

      throw new Error(
        'Missing markdown file'
      );

    }


    let md =
      await mdRes.text();


    /*
     * Remove YAML front matter.
     *
     * Example:
     *
     * ---
     * title: Example
     * tags: SOC
     * ---
     */
    md = md.replace(
      /^---\s*\n[\s\S]*?\n---\s*\n/,
      ''
    );


    /*
     * Fix image paths.
     */
    md = fixImagePaths(md);


    /*
     * Render Markdown.
     */
const renderedMarkdown = marked.parse(md);

content.innerHTML = `
  <div class="article-meta mono">
    <span>${meta.date}</span>
    <span class="cat">${meta.category}</span>
    <span class="tags">
      ${(meta.tags || [])
        .map(t => `<span class="tag-pill">${t}</span>`)
        .join('')}
    </span>
  </div>

  ${renderedMarkdown}
`;

content.querySelectorAll('pre code').forEach(function(block) {
  const languageClass = Array.from(block.classList)
    .find(cls => cls.startsWith('language-'));

  if (languageClass) {
    const language = languageClass.replace('language-', '');

    if (hljs.getLanguage(language)) {
      hljs.highlightElement(block);
    }
  } else {
    hljs.highlightElement(block);
  }
});


    /*
     * Find all article images.
     */
    const images =
      content.querySelectorAll('img');


    images.forEach(function(img) {

      /*
       * Lazy loading.
       */
      img.loading = 'lazy';

      img.decoding = 'async';


      /*
       * Default alt text.
       */
      if (!img.alt) {

        img.alt = 'Writeup image';

      }


      /*
       * Make focusable and operable by keyboard too.
       */
      img.tabIndex = 0;
      img.setAttribute('role', 'button');
      img.setAttribute('aria-label', 'Expand image: ' + img.alt);


      /*
       * Open image in fullscreen viewer.
       */
      function trigger() {
        openLightbox(img.src, img.alt);
      }

      img.addEventListener('click', trigger);
      img.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          trigger();
        }
      });

    });

  }


  catch (err) {

    console.error(
      'Writeup loading error:',
      err
    );


    content.innerHTML = `
      <p>
        Could not load this post.
        <a href="index.html#writeups">
          Back to the case log.
        </a>
      </p>
    `;

  }

}



/*
 * Image lightbox.
 */
const lightbox =
  document.getElementById(
    'image-lightbox'
  );

const lightboxImage =
  document.getElementById(
    'lightbox-image'
  );

const lightboxClose =
  document.getElementById(
    'image-lightbox-close'
  );



function openLightbox(src, alt) {

  lightboxImage.src = src;

  lightboxImage.alt = alt || 'Writeup image';

  lightbox.classList.add('active');

  document.body.style.overflow = 'hidden';

}



function closeLightbox() {

  lightbox.classList.remove('active');

  lightboxImage.src = '';

  document.body.style.overflow = '';

}



/*
 * Close when clicking background.
 */
lightbox.addEventListener(
  'click',
  function(event) {

    if (
      event.target === lightbox ||
      event.target === lightboxClose
    ) {

      closeLightbox();

    }

  }
);



/*
 * ESC closes image viewer.
 */
document.addEventListener(
  'keydown',
  function(event) {

    if (
      event.key === 'Escape' &&
      lightbox.classList.contains('active')
    ) {

      closeLightbox();

    }

  }
);



/*
 * Start loading.
 */
loadPost();

</script>
